[build-system]
requires = []
build-backend = "monophony_build"
backend-path = ["."]

[project]
name = "monophony"
version = "0.1.3"
description = "Python wrapper for Unison File Synchronizer with .gitignore translation"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[project.scripts]
monophony = "monophony.cli:main"

[dependency-groups]
dev = [
    "actionlint-py",
    "pytest",
    "ruff",
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "monophony_build.py" },
    { file = "unison-artifacts.json" },
    { file = "third_party/**" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
